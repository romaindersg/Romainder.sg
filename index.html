<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romainder | Singapore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2d5a27;
            --soft-white: #f8f9f8;
            --text-dark: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            scroll-behavior: smooth;
            background-color: var(--soft-white);
            overflow-x: hidden;
        }

        /* Logo */
        .site-logo {
            position: fixed;
            top: 30px;
            left: 40px;
            z-index: 1001;
            font-weight: bold;
            letter-spacing: 3px;
            color: white; 
            mix-blend-mode: difference; 
            font-size: 1.2rem;
            text-decoration: none;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('Romainder Main Page.jpeg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .title-box {
            border: 2px solid white;
            padding: 20px 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .title-box h1 { font-size: 4rem; margin: 0; letter-spacing: 8px; text-transform: uppercase; }
        .location-text { margin-top: 10px; font-size: 1.1rem; letter-spacing: 5px; }

        /* SIDEBAR NAVIGATION (Desktop) */
        .nav-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 60px; /* Slim when idle */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-sidebar:hover {
            width: 250px; /* Pops out on hover */
            background: white;
            border-left: 1px solid #eee;
        }

        .nav-links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 60px;
            transform: rotate(0deg);
            transition: transform 0.4s;
        }

        /* The sideways text */
        .side-link {
            text-decoration: none;
            color: white;
            mix-blend-mode: difference;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            transition: 0.3s;
            white-space: nowrap;
        }

        .nav-sidebar:hover .side-link {
            writing-mode: horizontal-tb; /* Flips to normal reading mode on hover */
            color: var(--primary-green);
            mix-blend-mode: normal;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* MOBILE MENU (Three Lines) */
        .mobile-toggle {
            display: none;
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 2000;
            color: white;
            mix-blend-mode: difference;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .mobile-nav {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background: white;
            z-index: 1999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
            gap: 40px;
        }

        .mobile-nav.active { right: 0; }
        .mobile-nav a { 
            text-decoration: none; 
            color: var(--primary-green); 
            font-size: 2rem; 
            letter-spacing: 3px; 
        }

        /* Footer */
        .site-footer {
            background-color: white;
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid #eee;
        }

        .social-footer {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social-footer a { color: var(--primary-green); font-size: 1.3rem; transition: 0.3s; }
        .social-footer a:hover { opacity: 0.6; transform: translateY(-3px); }

        .credit-text { font-size: 0.65rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }

        /* Media Queries */
        @media (max-width: 900px) {
            .nav-sidebar { display: none; }
            .mobile-toggle { display: block; }
            .title-box h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="site-logo">ROMAINDER</a>

    <div class="mobile-toggle" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </div>

    <div class="mobile-nav" id="mobileNav">
        <a href="whatwedo.html" onclick="toggleMenu()">WHAT WE DO</a>
        <a href="#" onclick="toggleMenu()">WHO ARE WE</a>
        <a href="#" onclick="toggleMenu()">CONTACT</a>
    </div>

    <nav class="nav-sidebar">
        <div class="nav-links-wrapper">
            <a href="whatwedo.html" class="side-link">WHAT WE DO</a>
            <a href="#" class="side-link">WHO ARE WE</a>
            <a href="#" class="side-link">CONTACT</a>
        </div>
    </nav>

    <section class="hero">
        <div class="title-box">
            <h1>ROMAINDER</h1>
            <div class="location-text">SINGAPORE</div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="social-footer">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>
        <p>&copy; 2026 Romainder. All rights reserved.</p>
        <p class="credit-text">Singapore</p>
    </footer>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('mobileNav');
            const icon = document.querySelector('.mobile-toggle i');
            nav.classList.toggle('active');
            
            // Switch between hamburger and "X" icon
            if (nav.classList.contains('active')) {
                icon.classList.replace('fa-bars', 'fa-times');
            } else {
                icon.classList.replace('fa-times', 'fa-bars');
            }
        }
    </script>
</body>
</html>
