<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Team | Romainder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #1b3d17;
            --soft-white: #f8f9f8;
            --accent-green: #e8f0e7;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--soft-white); 
            color: #333; 
        }

        .site-logo { 
            position: fixed; top: 30px; left: 40px; z-index: 1000; 
            font-weight: bold; letter-spacing: 3px; color: var(--primary-green); 
            text-decoration: none; font-size: 1.2rem; 
        }

        .page-header { 
            padding: 140px 10% 60px 10%; 
            background-color: var(--accent-green);
            text-align: center; 
        }

        .page-header h1 { 
            font-size: 2.5rem; letter-spacing: 5px; text-transform: uppercase; color: var(--primary-green);
        }

        .form-container { 
            max-width: 700px; margin: -40px auto 80px; 
            background: white; padding: 50px; 
            border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .form-group { margin-bottom: 25px; }
        .form-group label { 
            display: block; font-size: 0.85rem; text-transform: uppercase; 
            letter-spacing: 1px; font-weight: bold; margin-bottom: 8px; color: var(--primary-green);
        }

        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 4px; font-family: inherit; font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group textarea { height: 150px; resize: vertical; }

        .submit-btn { 
            width: 100%; padding: 20px; background: var(--primary-green); 
            color: white; border: none; border-radius: 4px; 
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px; 
            cursor: pointer; transition: 0.3s; 
        }

        .submit-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .back-nav { display: block; text-align: center; margin-top: 40px; text-decoration: none; color: var(--primary-green); font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
    </style>
</head>
<body>

    <a href="index.html" class="site-logo">ROMAINDER</a>

    <header class="page-header">
        <h1>Join the Team</h1>
    </header>

    <div class="form-container">
        <!-- action="submit.html" tells the browser where to go after clicking submit -->
        <form action="submit.html">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Enter your full name">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" required placeholder="Your age">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="email@example.com">
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" required placeholder="+65 XXXX XXXX">
            </div>

            <div class="form-group">
                <label>Basic Info / Background</label>
                <input type="text" placeholder="School, occupation, or current role">
            </div>

            <div class="form-group">
                <label>Why do you want to join Romainder?</label>
                <textarea required placeholder="Tell us about your interest in sustainability and food waste..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>

        <a href="index.html" class="back-nav">← Back to Home</a>
    </div>

</body>
</html>
