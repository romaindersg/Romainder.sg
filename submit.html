<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Received | Romainder</title>
    <style>
        :root {
            --primary-green: #1b3d17;
            --soft-white: #f8f9f8;
        }

        body { 
            margin: 0; padding: 0; 
            height: 100vh; display: flex; 
            justify-content: center; align-items: center; 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--soft-white);
            text-align: center;
        }

        .message-box { 
            background: white; padding: 60px; 
            border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
        }

        i { color: var(--primary-green); font-size: 4rem; margin-bottom: 20px; display: block; }

        h1 { color: var(--primary-green); letter-spacing: 2px; text-transform: uppercase; font-size: 1.5rem; }

        p { color: #666; line-height: 1.6; margin: 20px 0 40px 0; }

        .home-btn { 
            text-decoration: none; padding: 15px 40px; 
            background: var(--primary-green); color: white; 
            border-radius: 4px; font-weight: bold; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem;
        }
    </style>
    <!-- Font Awesome for the checkmark icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="message-box">
        <i class="fas fa-circle-check"></i>
        <h1>Application Received</h1>
        <p>Romainder will be in contact with you soon. Thank you for joining our cause and taking action against food waste.</p>
        <a href="index.html" class="home-btn">Back to Home</a>
    </div>

</body>
</html>
